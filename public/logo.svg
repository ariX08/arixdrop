<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pigeon sending a letter" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pigeon sending a letter</title>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#7fd4ff"/><stop offset="1" stop-color="#2a55ff"/></linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfeaff"/><stop offset="1" stop-color="#1f3fe0"/></linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f7ff"/><stop offset="1" stop-color="#3bb6f0"/></linearGradient>
    <linearGradient id="asc" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="256"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#7fd4ff"/><stop offset=".5" stop-color="#2a6bff"/><stop offset="1" stop-color="#1a2fd0"/></linearGradient>
    <radialGradient id="sky" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#3bb6f0" stop-opacity=".5"/><stop offset=".55" stop-color="#1f3fe0" stop-opacity=".2"/><stop offset="1" stop-color="#130f18" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="52"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; font-size: 9px; }
    .a { fill: url(#asc); }
    .pk { fill: #7fd4ff; }
    .r1 { opacity: .55; animation: fl 3.2s ease-in-out infinite; }
    .r2 { opacity: .35; animation: fl 3.2s ease-in-out -1.6s infinite; }
    .wing { transform-origin: 104px 80px; animation: flap .9s ease-in-out infinite; }
    .bob  { animation: bob 2.6s ease-in-out infinite; }
    .mail { transform-origin: 15px 10px; animation: send 2.6s ease-in-out infinite; }
    .tr   { opacity: 0; animation: tr 2.6s linear infinite; }
    .tl   { opacity: 0; animation: tl 1.2s linear infinite; }
    .t2{animation-delay:.12s}.t3{animation-delay:.24s}.t4{animation-delay:.36s}.t5{animation-delay:.48s}
    .l2{animation-delay:.3s}.l3{animation-delay:.6s}.l4{animation-delay:.9s}
    @keyframes fl   { 0%,100% { opacity: .55; } 50% { opacity: .2; } }
    @keyframes flap { 0%,100% { transform: rotate(16deg); } 50% { transform: rotate(-22deg); } }
    @keyframes bob  { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
    @keyframes send {
      0%   { opacity: 0; transform: translate(-6px,2px) scale(.8); }
      15%  { opacity: 1; transform: none; }
      50%  { opacity: 1; transform: translate(0,-1px); }
      100% { opacity: 0; transform: translate(34px,-14px) scale(.85); }
    }
    @keyframes tr { 0%,40% { opacity: 0; transform: translate(0,0); } 55% { opacity: .95; } 100% { opacity: 0; transform: translate(26px,-12px); } }
    @keyframes tl { 0% { opacity: 0; transform: translateX(8px); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateX(-14px); } }
    @media (prefers-reduced-motion: reduce) { .r1,.r2,.wing,.bob,.mail,.tr,.tl { animation: none; } .mail,.tr { opacity: 1; } }
  </style>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#130f18"/>
    <rect width="256" height="256" fill="url(#sky)"/>

    <!-- ascii field, bright at the top, fading to blue at the bottom -->
    <g class="a r1">
      <text x="8" y="22"  textLength="240">S8SS8S 888S888888####@@@@@#######  8# @#@#@@#@</text>
      <text x="8" y="48"  textLength="240">8SSS 888  S8 8##8## ##@@####@@@@@### @###@@##8</text>
      <text x="8" y="196" textLength="240">xxXXx  X x xXxSxXxx8XxX  XxxXXXX  X X  000SSS0</text>
      <text x="8" y="222" textLength="240">++ +  ++ X x+ ++ + x+++ +++  xX+ + +x +++++ x</text>
    </g>
    <g class="a r2">
      <text x="8" y="35"  textLength="240">8S8SS8 S 88 8888 888#8######@@####=###8@@#@@#</text>
      <text x="8" y="61"  textLength="240">SSS88S S8SS8888S8888 ##8####8##@X###+X## #Sx#</text>
      <text x="8" y="209" textLength="240">0 00S0000XX xxXXx xxXxxxX x xx xx+ +x x+ +xX</text>
      <text x="8" y="235" textLength="240">+  ++ ++  +  +  +  +  ++ x+++ ++  + + +  +</text>
    </g>

    <!-- scene, scaled to fill the square -->
    <g transform="translate(15 57.6) scale(.88)">
      <g>
        <text class="pk tl"    x="8"  y="78">+x0</text>
        <text class="pk tl l2" x="10" y="92">X#8</text>
        <text class="pk tl l3" x="6"  y="106">0S+</text>
        <text class="pk tl l4" x="12" y="120">@x=</text>
      </g>

      <g class="bob" filter="url(#glow)">
        <path fill="url(#pg)" d="M28 100 C50 70 90 58 120 66 C138 71 142 90 128 102 C110 116 60 118 28 100 Z"/>
        <circle fill="url(#pg)" cx="140" cy="60" r="14"/>
        <path fill="#e9f7ff" d="M152 58 L166 63 L152 67 Z"/>
        <circle cx="145" cy="57" r="2.2" fill="#130f18"/>
        <path class="wing" fill="url(#wg)" stroke="#bfeaff" stroke-width=".8" stroke-opacity=".6" d="M104 76 C90 70 60 70 32 88 C58 92 84 92 104 84 Z"/>
        <g transform="translate(180 46)">
          <g class="mail">
            <rect width="30" height="21" rx="3" fill="url(#mg)"/>
            <path d="M3 4 L15 13 L27 4" fill="none" stroke="#130f18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </g>
      </g>

      <g>
        <text class="pk tr"    x="212" y="62">01</text>
        <text class="pk tr t2" x="222" y="54">X</text>
        <text class="pk tr t3" x="214" y="48">#</text>
        <text class="pk tr t4" x="228" y="44">8</text>
        <text class="pk tr t5" x="236" y="38">+</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="255" height="255" rx="51.5" fill="none" stroke="#2c2836"/>
</svg>
